<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Subtítulos SRT, VTT y TXT online | Majagua Tools</title>
    <meta name="description" content="Convertí subtítulos entre SRT, WebVTT y texto plano en el navegador. Gratis, sin registro y sin subir tus archivos a ningún servidor.">
    <link rel="canonical" href="https://majaguaproducciones.com/tools/conver-sub.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Majagua Producciones">
    <meta property="og:title" content="Conversor de Subtítulos SRT, VTT y TXT online | Majagua Tools">
    <meta property="og:description" content="Convertí subtítulos entre SRT, WebVTT y texto plano en el navegador. Gratis, sin registro y sin subir tus archivos a ningún servidor.">
    <meta property="og:url" content="https://majaguaproducciones.com/tools/conver-sub.html">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="icon" type="image/png" href="../css/img/Icon.webp">
</head>

<body>
    <nav data-layout="nav"></nav>
    <script src="../js/layout.js"></script>

    <header data-layout="tools-hero"></header>

    <section class="tools-section">
        <div class="container">
            <h2 class="section-title">Conversor de Subtítulos SRT ↔ VTT ↔ TXT</h2>
            <p>Subí un archivo y convertilo al formato que necesites. Todo se procesa en tu navegador:
                tus subtítulos no se suben a ningún servidor.</p>

            <div class="controls">
                <input type="file" id="fileInput" accept=".srt,.vtt,.txt">
                <select id="formatSelect" aria-label="Formato de salida">
                    <option value="srt">Convertir a SRT</option>
                    <option value="vtt">Convertir a VTT</option>
                    <option value="txt">Convertir a TXT (solo texto)</option>
                </select>
                <button type="button" id="convertButton">Convertir</button>
            </div>

            <p id="statusMsg" class="status-msg" role="status"></p>

            <a id="downloadLink" download="subtitulos_convertidos.txt" style="display: none;">Descargar archivo
                convertido</a>

            <textarea id="outputText" placeholder="Aquí se mostrará el contenido convertido..."></textarea>

        </div>

    </section>



    <div data-layout="footer"></div>



    
    <script src="../js/main.js"></script>
    <script>
        (function () {
            const fileInput = document.getElementById('fileInput');
            const formatSelect = document.getElementById('formatSelect');
            const output = document.getElementById('outputText');
            const status = document.getElementById('statusMsg');
            const downloadLink = document.getElementById('downloadLink');

            let originalText = '';
            let baseName = 'subtitulos';
            let downloadUrl = null;

            const TIME = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[,.](\d{1,3})/;
            const TIMING_LINE = /-->/;

            function setStatus(msg, isError) {
                status.textContent = msg;
                status.classList.toggle('error', !!isError);
            }

            // Lee como UTF-8; si aparecen caracteres rotos, reintenta como Windows-1252 (Latin-1)
            function readFile(file) {
                return file.arrayBuffer().then(buf => {
                    let text = new TextDecoder('utf-8').decode(buf);
                    if (text.includes('\uFFFD')) text = new TextDecoder('windows-1252').decode(buf);
                    return text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
                });
            }

            function toMs(match) {
                const [, h, m, sec, ms] = match;
                return ((+(h || 0) * 60 + +m) * 60 + +sec) * 1000 + +ms.padEnd(3, '0');
            }

            function formatTime(ms, sep) {
                const pad = (n, l = 2) => String(n).padStart(l, '0');
                const h = Math.floor(ms / 3600000);
                const m = Math.floor(ms / 60000) % 60;
                const s = Math.floor(ms / 1000) % 60;
                return `${pad(h)}:${pad(m)}:${pad(s)}${sep}${pad(ms % 1000, 3)}`;
            }

            // Convierte SRT o VTT en una lista de { start, end, lines }
            function parseCues(text) {
                const cues = [];
                for (const block of text.split(/\n{2,}/)) {
                    const lines = block.split('\n').filter(l => l.trim() !== '');
                    const t = lines.findIndex(l => TIMING_LINE.test(l));
                    if (t === -1) continue; // encabezado WEBVTT, NOTE, STYLE, etc.

                    const [left, right] = lines[t].split('-->');
                    const start = left.match(TIME), end = right.match(TIME);
                    if (!start || !end) continue;

                    cues.push({ start: toMs(start), end: toMs(end), lines: lines.slice(t + 1) });
                }
                return cues;
            }

            // Quita etiquetas propias de VTT (<v Nombre>, <c.clase>, marcas de tiempo) y deja <i>, <b>, <u>
            const cleanForSrt = line => line.replace(/<(?!\/?[ibu]>)[^>]*>/g, '');
            const stripTags = line => line.replace(/<[^>]*>/g, '').replace(/\{\\[^}]*\}/g, '');

            function build(cues, format) {
                if (format === 'srt') {
                    return cues.map((c, i) =>
                        `${i + 1}\n${formatTime(c.start, ',')} --> ${formatTime(c.end, ',')}\n${c.lines.map(cleanForSrt).join('\n')}`
                    ).join('\n\n') + '\n';
                }
                if (format === 'vtt') {
                    return 'WEBVTT\n\n' + cues.map(c =>
                        `${formatTime(c.start, '.')} --> ${formatTime(c.end, '.')}\n${c.lines.join('\n')}`
                    ).join('\n\n') + '\n';
                }
                return cues.map(c => c.lines.map(stripTags).join(' ').trim()).filter(Boolean).join('\n') + '\n';
            }

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                baseName = file.name.replace(/\.[^.]+$/, '') || 'subtitulos';
                readFile(file).then(text => {
                    originalText = text;
                    output.value = text;
                    downloadLink.style.display = 'none';
                    setStatus(`Archivo cargado: ${file.name}`);
                });
            });

            document.getElementById('convertButton').addEventListener('click', () => {
                if (!originalText) { setStatus('Primero subí un archivo de subtítulos.', true); return; }

                const format = formatSelect.value;
                const cues = parseCues(originalText);

                if (!cues.length) {
                    setStatus('No encontré tiempos en el archivo. Para convertir a SRT o VTT, el archivo de origen tiene que tener códigos de tiempo (por ejemplo, un .srt o .vtt).', true);
                    return;
                }

                const result = build(cues, format);
                output.value = result;

                if (downloadUrl) URL.revokeObjectURL(downloadUrl);
                const mime = format === 'vtt' ? 'text/vtt' : 'text/plain';
                downloadUrl = URL.createObjectURL(new Blob([result], { type: `${mime};charset=utf-8` }));
                downloadLink.href = downloadUrl;
                downloadLink.download = `${baseName}.${format}`;
                downloadLink.style.display = 'inline-block';
                setStatus(`Listo: ${cues.length} subtítulos convertidos a ${format.toUpperCase()}.`);
                if (window.majaguaTrack) window.majaguaTrack('subtitulos-' + format + '');
            });
        })();
    </script>
</body>

</html>
