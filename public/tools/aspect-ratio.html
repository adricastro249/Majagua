<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Aspect Ratio y Letterbox online | Majagua Tools</title>
    <meta name="description" content="Subí una imagen y simulá encuadres cinematográficos (1.85, 2.39, 16:9, 4:3, 9:16) con letterbox o pillarbox. Gratis y sin subir archivos a ningún servidor.">
    <link rel="canonical" href="https://majaguaproducciones.com/tools/aspect-ratio.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Majagua Producciones">
    <meta property="og:title" content="Simulador de Aspect Ratio y Letterbox online | Majagua Tools">
    <meta property="og:description" content="Subí una imagen y simulá encuadres cinematográficos (1.85, 2.39, 16:9, 4:3, 9:16) con letterbox o pillarbox. Gratis y sin subir archivos a ningún servidor.">
    <meta property="og:url" content="https://majaguaproducciones.com/tools/aspect-ratio.html">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="icon" type="image/png" href="../css/img/Icon.webp">
</head>
<body>
    <nav data-layout="nav"></nav>
    <script src="../js/layout.js"></script>

    <header data-layout="tools-hero"></header>



   <section class="tools-section">
        <div class="container">
            <h2 class="section-title">Visualizador de Aspect Ratios</h2>

            <p>Subí una imagen o fotograma y elegí un aspect ratio para simular el encuadre con letterbox o pillarbox.
                La imagen se procesa en tu navegador: no se sube a ningún servidor.</p>

            <div class="controls-wrapper">
                <div>
                    <label for="imageUpload">Seleccionar imagen:</label><br>
                    <input type="file" id="imageUpload" accept="image/*" />
                </div>
                <div>
                    <label for="aspectRatio">Elegir aspect ratio:</label><br>
                    <select id="aspectRatio">
                        <optgroup label="Cine y TV">
                            <option value="1.333">1.33 (4:3)</option>
                            <option value="1.66">1.66</option>
                            <option value="1.778" selected>1.78 (16:9)</option>
                            <option value="1.85">1.85 (Flat)</option>
                            <option value="2.0">2.00</option>
                            <option value="2.35">2.35</option>
                            <option value="2.39">2.39 (Scope)</option>
                            <option value="2.4">2.40</option>
                            <option value="2.76">2.76 (Ultra Panavision)</option>
                        </optgroup>
                        <optgroup label="Redes">
                            <option value="1">1:1 (Cuadrado)</option>
                            <option value="0.8">4:5 (Feed vertical)</option>
                            <option value="0.5625">9:16 (Reels / Stories)</option>
                        </optgroup>
                    </select>
                </div>
                <div style="display: flex; align-items: flex-start; padding-top: 1.8rem;">
                    <button id="resetButton" type="button">Reset</button>
                </div>
            </div>

            <div id="container">
                <div id="frame">
                    <img id="preview" src="" alt="Vista previa" style="display: none;" />
                    <div id="top-bar" class="letterbox"></div>
                    <div id="bottom-bar" class="letterbox"></div>
                    <div id="left-bar" class="letterbox pillar"></div>
                    <div id="right-bar" class="letterbox pillar"></div>
                </div>
                <p class="placeholder-text" id="placeholder">Subí una imagen para empezar</p>
            </div>
            <p id="ratioInfo" class="ratio-info"></p>
        </div>
    </section>



    <div data-layout="footer"></div>


    <script src="../js/main.js"></script>
    <script>
        (function () {
            const upload = document.getElementById('imageUpload');
            const preview = document.getElementById('preview');
            const select = document.getElementById('aspectRatio');
            const placeholder = document.getElementById('placeholder');
            const info = document.getElementById('ratioInfo');
            const bars = {
                top: document.getElementById('top-bar'),
                bottom: document.getElementById('bottom-bar'),
                left: document.getElementById('left-bar'),
                right: document.getElementById('right-bar')
            };
            const DEFAULT_RATIO = '1.778';
            clearBars();

            function clearBars() {
                bars.top.style.height = bars.bottom.style.height = '0%';
                bars.left.style.width = bars.right.style.width = '0%';
            }

            // Usa porcentajes: las barras se mantienen correctas al cambiar el tamaño de la ventana
            function applyAspectRatio() {
                clearBars();
                if (!preview.naturalWidth) { info.textContent = ''; return; }

                const imgRatio = preview.naturalWidth / preview.naturalHeight;
                const target = parseFloat(select.value);

                if (Math.abs(target - imgRatio) < 0.005) {
                    info.textContent = `Tu imagen ya es ${imgRatio.toFixed(2)}:1`;
                } else if (target > imgRatio) {
                    const pct = (1 - imgRatio / target) / 2 * 100; // letterbox (arriba/abajo)
                    bars.top.style.height = bars.bottom.style.height = pct + '%';
                    info.textContent = `Imagen ${imgRatio.toFixed(2)}:1 → ${target.toFixed(2)}:1 · letterbox (${(pct * 2).toFixed(1)}% de alto recortado)`;
                } else {
                    const pct = (1 - target / imgRatio) / 2 * 100; // pillarbox (costados)
                    bars.left.style.width = bars.right.style.width = pct + '%';
                    info.textContent = `Imagen ${imgRatio.toFixed(2)}:1 → ${target.toFixed(2)}:1 · pillarbox (${(pct * 2).toFixed(1)}% de ancho recortado)`;
                }
            }

            upload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => { preview.src = event.target.result; };
                reader.readAsDataURL(file);
            });

            preview.addEventListener('load', () => {
                if (window.majaguaTrack) window.majaguaTrack('aspect-ratio-imagen');
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                applyAspectRatio();
            });

            select.addEventListener('change', applyAspectRatio);

            document.getElementById('resetButton').addEventListener('click', () => {
                select.value = DEFAULT_RATIO;
                clearBars();
                info.textContent = '';
            });
        })();
    </script>
</body>

</html>
