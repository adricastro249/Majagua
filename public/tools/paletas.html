<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Paletas de Color desde Imagen | Majagua Tools</title>
    <meta name="description" content="Extrae la paleta de colores de cualquier imagen o fotograma y copia los códigos HEX para tu dirección de arte, pitch o corrección de color.">
    <link rel="canonical" href="https://majaguaproducciones.com/tools/paletas.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Majagua Producciones">
    <meta property="og:title" content="Generador de Paletas de Color desde Imagen | Majagua Tools">
    <meta property="og:description" content="Extrae la paleta de colores de cualquier imagen o fotograma y copia los códigos HEX para tu dirección de arte, pitch o corrección de color.">
    <meta property="og:url" content="https://majaguaproducciones.com/tools/paletas.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tools-base.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="icon" type="image/png" href="../img/icon.png">

</head>

<body>

    <nav data-layout="nav"></nav>
    <script src="../js/layout.js"></script>

    <header data-layout="tools-hero"></header>
    <section class="tools-section" data-zone-name="Herramienta">
        
        <div class="controls-wrapper-paleta">
            <h2 class="section-title">Creador de Paletas Cinemáticas</h2>
            <p>Sube una imagen o fotograma y extrae los colores clave para tu dirección de arte o pitch. Haz clic en un color para copiar su código HEX.</p>
      
    <input type="file" id="imageInput" accept="image/*" />

            <br>
            <canvas id="canvas" style="display: none;"></canvas>
            <img id="imagePreview" src="" alt="Imagen previa" style="display:none;" />
            <div id="results-area" class="palette-results" style="display: none;">
                <h3>Paleta detectada</h3>
                <div id="palette"></div>
                <button type="button" id="downloadPdfBtn" class="btn-pdf">
                    <i class="fas fa-file-pdf"></i> Descargar paleta en PDF
                </button>
            </div>
        </div>
    </section>
    <div data-layout="footer"></div>
    <script>
        (function () {
            const imageInput = document.getElementById('imageInput');
            const imagePreview = document.getElementById('imagePreview');
            const canvas = document.getElementById('canvas');
            const palette = document.getElementById('palette');
            const resultsArea = document.getElementById('results-area');
            let currentPalette = [];

            const MAX_COLORS = 8;
            const MIN_DISTANCE = 45; // qué tan distintos deben ser dos colores de la paleta

            const rgbToHex = (r, g, b) =>
                '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('').toUpperCase();

            const distance = (c1, c2) =>
                Math.sqrt((c1[0] - c2[0]) ** 2 + (c1[1] - c2[1]) ** 2 + (c1[2] - c2[2]) ** 2);

            imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => { imagePreview.src = event.target.result; };
                reader.readAsDataURL(file);
            });

            imagePreview.addEventListener('load', () => {
                imagePreview.style.display = 'block';

                // Reducir manteniendo la proporción (más rápido y sin deformar)
                const maxSide = 300;
                const scale = Math.min(1, maxSide / Math.max(imagePreview.naturalWidth, imagePreview.naturalHeight));
                canvas.width = Math.max(1, Math.round(imagePreview.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(imagePreview.naturalHeight * scale));

                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(imagePreview, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                // Agrupar en "cubetas" de color y guardar el promedio real de cada una
                const buckets = new Map();
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] < 125) continue; // ignorar transparencias
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
                    const bucket = buckets.get(key);
                    if (bucket) { bucket.r += r; bucket.g += g; bucket.b += b; bucket.n++; }
                    else buckets.set(key, { r, g, b, n: 1 });
                }

                // Descartar colores que ocupan menos del 0,5% de la imagen (bordes, ruido)
                const total = [...buckets.values()].reduce((sum, c) => sum + c.n, 0);
                const candidates = [...buckets.values()]
                    .filter(c => c.n >= total * 0.005)
                    .sort((a, b) => b.n - a.n)
                    .map(c => [c.r / c.n, c.g / c.n, c.b / c.n]);

                // Elegir los más frecuentes que sean suficientemente distintos entre sí
                const topColors = [];
                for (const color of candidates) {
                    if (topColors.every(c => distance(c, color) >= MIN_DISTANCE)) topColors.push(color);
                    if (topColors.length >= MAX_COLORS) break;
                }

                renderPalette(topColors.map(([r, g, b]) => rgbToHex(r, g, b)));
                if (window.majaguaTrack) window.majaguaTrack('paletas-generar');
            });

            function renderPalette(hexes) {
                currentPalette = hexes;
                resultsArea.style.display = 'block';
                palette.innerHTML = '';
                hexes.forEach(hex => {
                    const swatch = document.createElement('button');
                    swatch.type = 'button';
                    swatch.className = 'color-swatch';
                    swatch.style.background = hex;
                    swatch.title = `Copiar ${hex}`;
                    swatch.innerHTML = `<span class="color-code">${hex}</span>`;
                    swatch.addEventListener('click', () => copy(hex, swatch.querySelector('span')));
                    palette.appendChild(swatch);
                });
            }

            // ---------- PDF (jsPDF se descarga solo cuando hace falta) ----------
            function loadJsPdf() {
                if (window.jspdf) return Promise.resolve(window.jspdf);
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                    script.onload = () => resolve(window.jspdf);
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            // Pasa la imagen a JPEG liviano (sirve para PNG, WebP, etc.)
            function imageAsJpeg(maxSide) {
                const scale = Math.min(1, maxSide / Math.max(imagePreview.naturalWidth, imagePreview.naturalHeight));
                const c = document.createElement('canvas');
                c.width = Math.round(imagePreview.naturalWidth * scale);
                c.height = Math.round(imagePreview.naturalHeight * scale);
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(imagePreview, 0, 0, c.width, c.height);
                return { data: c.toDataURL('image/jpeg', 0.9), ratio: c.height / c.width };
            }

            document.getElementById('downloadPdfBtn').addEventListener('click', () => {
                const btn = document.getElementById('downloadPdfBtn');
                btn.disabled = true;
                loadJsPdf().then(({ jsPDF }) => {
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const pageW = 210, margin = 20, usableW = pageW - margin * 2;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(20);
                    doc.setTextColor(7, 85, 123);
                    doc.text('Paleta de color', pageW / 2, 22, { align: 'center' });
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(120);
                    doc.text('Generada con Majagua Tools · majaguaproducciones.com', pageW / 2, 29, { align: 'center' });

                    // Imagen de referencia: entra a lo ancho, con alto máximo de 140 mm
                    const img = imageAsJpeg(1600);
                    let w = usableW, h = w * img.ratio;
                    if (h > 140) { h = 140; w = h / img.ratio; }
                    doc.addImage(img.data, 'JPEG', (pageW - w) / 2, 38, w, h);

                    let y = 38 + h + 14;
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(12);
                    doc.setTextColor(30);
                    doc.text('Colores', margin, y);
                    y += 6;

                    // Muestras: 4 por fila, con HEX y RGB
                    const perRow = 4, gap = 6, box = (usableW - gap * (perRow - 1)) / perRow, boxH = 22;
                    currentPalette.forEach((hex, i) => {
                        const col = i % perRow, row = Math.floor(i / perRow);
                        const x = margin + col * (box + gap), top = y + row * (boxH + 16);
                        const [r, g, b] = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16));
                        doc.setFillColor(r, g, b);
                        doc.setDrawColor(210);
                        doc.roundedRect(x, top, box, boxH, 2, 2, 'FD');
                        doc.setFont('courier', 'bold');
                        doc.setFontSize(9);
                        doc.setTextColor(40);
                        doc.text(hex, x, top + boxH + 5);
                        doc.setFont('courier', 'normal');
                        doc.setFontSize(7.5);
                        doc.setTextColor(110);
                        doc.text(`RGB ${r}, ${g}, ${b}`, x, top + boxH + 9.5);
                    });

                    doc.save('Paleta-Majagua.pdf');
                    if (window.majaguaTrack) window.majaguaTrack('paletas-pdf');
                }).catch(() => {
                    alert('No se pudo generar el PDF. Revisa tu conexión e intenta de nuevo.');
                }).finally(() => { btn.disabled = false; });
            });

            function copy(text, label) {
                const done = () => {
                    label.textContent = 'COPIADO';
                    setTimeout(() => { label.textContent = text; }, 1000);
                };
                if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
            }
        })();
    </script>
</body>

</html>
