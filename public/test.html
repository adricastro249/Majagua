<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        --deep-blue: #07557b;
        /* Tu azul oscuro */
        --ocean-mid: #03648e;
        /* Azul intermedio */
        --cyan-bright: #0090b8;
        /* Cyan de acento */
        --sand-white: #f4f8fb;
        /* Blanco "hielo" suave */
        --text-dark: #2c3e50;
        --text-white: #ffffff;


        .mobile-container {
            max-width: 480px;
            margin: auto;

            height: 500px;
            color: white;
            border-radius: 10px;
        }

        .topnav {
            overflow: hidden;
            background-color: #0090b8;
            position: relative;
        }

        .topnav #myLinks {
            display: none;
        }

        .topnav a {
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
            display: block;
        }

        .topnav a.icon {
            background: #03648e;
            display: block;
            position: absolute;
            right: 0;
            top: 0;
        }

        .topnav a:hover {
            background-color: #0090b8;
            color: black;
        }

        .active {
            background-color: #07557b;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Simulate a smartphone / tablet -->
    <div class="mobile-container">

        <!-- Top Navigation Menu -->


        <div class="topnav">
            <a href="#home" class="active">Logo</a>
            <div id="myLinks">
                <a href="index.html">Inicio</a>
                <a href="index.html#team">Nosotras</a>
                <a href="index.html#ecosistema">Ecosistema</a>
                <div class="subnav">
                    <button class="subnavbtn">Tools<i class="fa fa-caret-down"></i></button>

                    <div class="subnav-content">
                        <a href="../tools/aspect-ratio.html">Simula tu Aspect Ratio</a>
                        <a href="../tools/paletas.html">Creador de paletas</a>
                        <a href="../tools/conver-sub.html">Conversion de subtitulos</a>
                    </div>
                </div>
                <li><a href="mailto:produccionesmajagua@gmail.com" class="btn-contact">Contacto</a></li>
            </div>
            <a href="javascript:void(0);" class="icon" onclick="myFunction()">
                <i class="fa fa-bars"></i>
            </a>
        </div>



        <!-- End smartphone / tablet look -->
    </div>

    <script>
        function myFunction() {
            var x = document.getElementById("myLinks");
            if (x.style.display === "block") {
                x.style.display = "none";
            } else {
                x.style.display = "block";
            }
        }
    </script>

</body>

</html>
